---
- name: Audit Linux performance
  hosts: Linux_Servers
  gather_facts: true
  become: true

  tasks:
    - name: Display CPU and memory facts
      ansible.builtin.debug:
        msg:
          - "Processors: {{ ansible_facts.processor_vcpus }}"
          - "Memory total MB: {{ ansible_facts.memtotal_mb }}"
          - "Memory free MB: {{ ansible_facts.memfree_mb }}"
          - "Swap total MB: {{ ansible_facts.swaptotal_mb }}"
          - "Swap free MB: {{ ansible_facts.swapfree_mb }}"

    - name: Collect uptime and load
      ansible.builtin.command:
        argv:
          - uptime
      register: uptime_result
      changed_when: false

    - name: Collect memory utilization
      ansible.builtin.command:
        argv:
          - free
          - -h
      register: memory_result
      changed_when: false

    - name: Collect virtual-memory statistics
      ansible.builtin.command:
        argv:
          - vmstat
          - 1
          - 3
      register: vmstat_result
      changed_when: false

    - name: Collect highest CPU-consuming processes
      ansible.builtin.shell: >-
        set -o pipefail &&
        ps -eo pid,user,%cpu,%mem,stat,cmd
        --sort=-%cpu | head -n 11
      args:
        executable: /bin/bash
      register: cpu_processes
      changed_when: false

    - name: Display performance results
      ansible.builtin.debug:
        msg:
          - "{{ uptime_result.stdout }}"
          - "{{ memory_result.stdout_lines }}"
          - "{{ vmstat_result.stdout_lines }}"
          - "{{ cpu_processes.stdout_lines }}"
