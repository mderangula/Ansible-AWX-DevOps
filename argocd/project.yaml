apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portfolio
  namespace: argocd
spec:
  description: Restricted project for the automation portfolio workloads
  roles:
    - name: github-actions
      description: Sync and observe hello-world from GitHub Actions
      policies:
        - >-
          p, proj:portfolio:github-actions, applications, get,
          portfolio/hello-world, allow
        - >-
          p, proj:portfolio:github-actions, applications, sync,
          portfolio/hello-world, allow
        - >-
          p, proj:portfolio:github-actions, logs, get,
          portfolio/hello-world, allow
  sourceRepos:
    - https://github.com/mderangula/Ansible-AWX-DevOps.git
  destinations:
    - namespace: hello-world
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
  orphanedResources:
    warn: true
